<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyler's Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem 0;
      box-sizing: border-box;
      background-color: #f0fff4;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #2e7d32;
      font-size: 3rem;
    }

    .game {
      width: 32rem;
      max-width: 94vw;
      padding: 1.5rem;
      border-radius: 1.25rem;
      background-color: #ffffff;
      box-shadow: 0 0.5rem 1.5rem rgba(198, 40, 40, 0.3);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      color: #b71c1c;
      font-size: 1.5rem;
    }

    .scoreboard span {
      font-size: 1rem;
      color: #e57373;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0.75rem;
      background-color: #ffebee;
      touch-action: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .hint {
      color: #e57373;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    button {
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      background-color: #c62828;
      color: #ffffff;
      font-size: 1.15rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background-color: #b71c1c;
    }

    button:active {
      transform: translateY(0.0625rem);
    }

    button:focus-visible {
      outline: 0.1875rem solid #c62828;
      outline-offset: 0.125rem;
    }

    @media (max-width: 30rem) {
      h1 { font-size: 2.25rem; }
      .controls { flex-direction: column; align-items: stretch; text-align: center; }
    }
  </style>
</head>
<body>
  <h1>Tyler's Calculator</h1>

  <div class="game">
    <div class="scoreboard">
      <div><span>Score</span> <strong id="score" role="status" aria-live="polite">0</strong></div>
      <div><span>Best</span> <strong id="best">0</strong></div>
    </div>

    <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>

    <div class="controls">
      <p class="hint">Arrow keys or WASD to steer<br>Space to pause &middot; swipe on touch</p>
      <button id="new-game">New Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const context = canvas.getContext('2d');
    const scoreLabel = document.getElementById('score');
    const bestLabel = document.getElementById('best');
    const newGameButton = document.getElementById('new-game');

    const GRID = 20;                       // board is GRID x GRID cells
    const CELL = canvas.width / GRID;
    const START_INTERVAL = 140;            // ms per move
    const MIN_INTERVAL = 70;
    const SPEEDUP = 4;                     // ms shaved off per apple

    let snake, direction, queued, food, score, best, state, interval, sinceMove, lastFrame;

    /* ---------- state ---------- */

    function loadBest() {
      try {
        return parseInt(localStorage.getItem('snake-best'), 10) || 0;
      } catch (error) {
        return 0; // storage can be blocked; the game still works without it
      }
    }

    function saveBest(value) {
      try {
        localStorage.setItem('snake-best', String(value));
      } catch (error) {
        /* ignore */
      }
    }

    function reset() {
      const middle = Math.floor(GRID / 2);
      snake = [
        { x: middle, y: middle },
        { x: middle - 1, y: middle },
        { x: middle - 2, y: middle }
      ];
      direction = { x: 1, y: 0 };
      queued = [];
      score = 0;
      interval = START_INTERVAL;
      sinceMove = 0;
      state = 'ready';
      placeFood();
      updateScore();
    }

    function updateScore() {
      scoreLabel.textContent = score;
      bestLabel.textContent = best;
    }

    function placeFood() {
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (!snake.some(part => part.x === x && part.y === y)) free.push({ x: x, y: y });
        }
      }
      // No free cell means the snake fills the board — a win.
      food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    /* ---------- simulation ---------- */

    // Turns are queued so two quick presses in one tick both register, and a
    // 180-degree turn into your own neck is rejected.
    function turn(x, y) {
      const last = queued.length ? queued[queued.length - 1] : direction;
      if (last.x === -x && last.y === -y) return;
      if (last.x === x && last.y === y) return;
      if (queued.length < 2) queued.push({ x: x, y: y });
    }

    function step() {
      if (queued.length) direction = queued.shift();

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return gameOver();

      // The tail cell is about to be vacated, so moving into it is legal.
      const ate = food && head.x === food.x && head.y === food.y;
      const body = ate ? snake : snake.slice(0, -1);
      if (body.some(part => part.x === head.x && part.y === head.y)) return gameOver();

      snake.unshift(head);
      if (ate) {
        score++;
        interval = Math.max(MIN_INTERVAL, interval - SPEEDUP);
        placeFood();
        if (!food) return win();
        updateScore();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      state = 'over';
      if (score > best) {
        best = score;
        saveBest(best);
      }
      updateScore();
    }

    function win() {
      state = 'won';
      if (score > best) {
        best = score;
        saveBest(best);
      }
      updateScore();
    }

    /* ---------- rendering ---------- */

    function roundedCell(x, y, inset, radius) {
      const size = CELL - inset * 2;
      context.beginPath();
      context.roundRect(x * CELL + inset, y * CELL + inset, size, size, radius);
      context.fill();
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      context.strokeStyle = '#ffdfe3';
      context.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        context.beginPath();
        context.moveTo(i * CELL, 0);
        context.lineTo(i * CELL, canvas.height);
        context.moveTo(0, i * CELL);
        context.lineTo(canvas.width, i * CELL);
        context.stroke();
      }

      if (food) {
        context.fillStyle = '#2e7d32';
        context.beginPath();
        context.arc((food.x + 0.5) * CELL, (food.y + 0.5) * CELL, CELL * 0.32, 0, Math.PI * 2);
        context.fill();
      }

      snake.forEach(function (part, index) {
        context.fillStyle = index === 0 ? '#b71c1c' : '#e05252';
        roundedCell(part.x, part.y, 1.5, 5);
      });

      if (state !== 'running') drawOverlay();
    }

    function drawOverlay() {
      const messages = {
        ready: ['Snake', 'Press any arrow key to start'],
        paused: ['Paused', 'Press space to resume'],
        over: ['Game Over', 'Score ' + score + ' · press space to play again'],
        won: ['You filled the board!', 'Score ' + score + ' · press space to play again']
      };
      const [title, subtitle] = messages[state];

      context.fillStyle = 'rgba(255, 235, 238, 0.76)';
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = '#b71c1c';
      context.textAlign = 'center';
      context.font = 'bold 2.5rem Arial, Helvetica, sans-serif';
      context.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
      context.font = '1.05rem Arial, Helvetica, sans-serif';
      context.fillStyle = '#c62828';
      context.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 28);
    }

    /* ---------- loop ---------- */

    function frame(timestamp) {
      const elapsed = timestamp - (lastFrame || timestamp);
      lastFrame = timestamp;

      if (state === 'running') {
        sinceMove += elapsed;
        while (sinceMove >= interval && state === 'running') {
          sinceMove -= interval;
          step();
        }
      }

      draw();
      requestAnimationFrame(frame);
    }

    /* ---------- input ---------- */

    const KEYS = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };

    function start() {
      if (state === 'over' || state === 'won') reset();
      state = 'running';
      sinceMove = 0;
    }

    function togglePause() {
      if (state === 'running') state = 'paused';
      else start();
    }

    document.addEventListener('keydown', function (event) {
      const move = KEYS[event.key] || KEYS[event.key.toLowerCase()];

      if (move) {
        if (state === 'ready' || state === 'paused') start();
        if (state === 'running') turn(move[0], move[1]);
        event.preventDefault();
      } else if (event.key === ' ') {
        togglePause();
        event.preventDefault();
      }
    });

    newGameButton.addEventListener('click', function () {
      reset();
      start();
      canvas.focus();
    });

    // Swipe controls for touch devices.
    let touchStart = null;
    canvas.addEventListener('touchstart', function (event) {
      const touch = event.changedTouches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', function (event) {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return togglePause();
      if (state === 'ready' || state === 'paused' || state === 'over' || state === 'won') start();
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
      event.preventDefault();
    }, { passive: false });

    best = loadBest();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
